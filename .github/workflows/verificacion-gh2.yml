# Temporal: verificación de GH-2 en un entorno con Docker. Se elimina antes del PR (la CI real es GH-12).
name: Verificación GH-2

on:
  push:
    branches: ["feature/GH-2-**"]

jobs:
  servidor:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: prueba123
      MAX_SUBIDA: 1m
    steps:
      - uses: actions/checkout@v4

      - name: Configuración de Compose válida
        run: docker compose config --quiet

      - name: Arranque con healthchecks
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Estado de los servicios
        run: docker compose ps

      - name: Configuración de nginx válida
        run: docker compose exec -T proxy nginx -t

      - name: Solo el proxy publica puerto
        run: |
          docker compose ps --format '{{.Service}} {{.Publishers}}'
          test -z "$(docker compose port backend 3000 2>/dev/null)"
          test -z "$(docker compose port db 5432 2>/dev/null)"

      - name: API a través del proxy
        run: curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"estado":"ok"'

      - name: PWA y redirección de rutas a index.html
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<title>Vestuario</title>'
          curl -fsS http://localhost:8080/plantilla/123 | grep -q '<title>Vestuario</title>'
          curl -sSI http://localhost:8080/ | tee /dev/stderr | grep -qi '^cache-control: no-cache'

      - name: Caché larga de assets, gzip y cabeceras
        run: |
          asset=$(curl -fsS http://localhost:8080/ | grep -o '/assets/index-[^"]*\.js' | head -1)
          echo "asset: $asset"
          curl -sSI "http://localhost:8080$asset" | tee /dev/stderr | grep -qi '^cache-control: max-age=31536000'
          curl -sSI -H 'Accept-Encoding: gzip' "http://localhost:8080$asset" | grep -qi '^content-encoding: gzip'
          curl -sSI "http://localhost:8080$asset" | grep -qi '^x-content-type-options: nosniff'
          curl -sSI "http://localhost:8080$asset" | grep -qi '^server: nginx$'

      - name: Límite de subida (MAX_SUBIDA=1m)
        run: |
          head -c 2000000 /dev/zero > grande.bin
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST --data-binary @grande.bin http://localhost:8080/api/health)
          echo "código: $code"
          test "$code" = "413"

      - name: El proxy sigue funcionando tras reiniciar el backend
        run: |
          docker compose restart backend
          docker compose up -d --wait --wait-timeout 60
          curl -fsS http://localhost:8080/api/health

      - name: Usuarios sin privilegios y zona horaria
        run: |
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T proxy id -u)" != "0"
          docker compose exec -T backend date
          docker compose exec -T backend sh -c 'test "$(date +%Z)" = CEST || test "$(date +%Z)" = CET'
          docker compose exec -T backend sh -c 'touch /app/uploads/prueba && rm /app/uploads/prueba'

      - name: Rotación de logs configurada
        run: |
          for s in db backend proxy; do
            docker inspect "$(docker compose ps -q $s)" --format "$s {{.HostConfig.LogConfig.Type}} {{.HostConfig.LogConfig.Config}}"
          done

      - name: Tamaño de las imágenes
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep vestuario

      - name: Logs
        if: always()
        run: docker compose logs --no-color

  desarrollo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuración de Compose válida
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Arranque sin .env
        run: docker compose -f docker-compose.dev.yml up -d --build --wait --wait-timeout 180

      - name: Frontend (Vite) y API a través de su redirección
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:5173/api/health && break; sleep 2; done
          curl -fsS http://localhost:5173/api/health | grep -q '"estado":"ok"'
          curl -fsS http://localhost:5173/ | grep -q '<title>Vestuario</title>'

      - name: Vite puede escribir su caché de dependencias (node_modules/.vite)
        run: |
          dep=$(curl -fsS http://localhost:5173/src/main.tsx | grep -o '/node_modules/\.vite/deps/[^"?]*' | head -1)
          echo "dependencia optimizada: $dep"
          test -n "$dep"
          curl -fsS "http://localhost:5173$dep" > /dev/null

      - name: Recarga en caliente del backend
        run: |
          sed -i "s/estado: 'ok'/estado: 'ok', recarga: true/" backend/src/index.ts
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health | grep -q recarga && exit 0; sleep 1; done
          exit 1

      - name: PostgreSQL accesible en localhost
        run: docker compose -f docker-compose.dev.yml exec -T db psql -U vestuario -d vestuario -c 'select version()'

      - name: Logs
        if: always()
        run: docker compose -f docker-compose.dev.yml logs --no-color
