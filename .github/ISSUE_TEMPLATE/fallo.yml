name: Fallo
description: Algo no funciona como debería
labels: ["bug"]
body:
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      description: Determina la rama de la corrección.
      options:
        - Pruebas (rama fix/GH-n desde develop)
        - Producción (rama hotfix/GH-n desde main; añade la etiqueta hotfix)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      description: Tag desplegado en producción o commit de develop en pruebas.
      placeholder: v1.0.0
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      value: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
      description: Incluye mensajes de error o capturas si las hay.
    validations:
      required: true
  - type: input
    id: dispositivo
    attributes:
      label: Dispositivo y navegador
      placeholder: Android 15, Chrome (PWA instalada)
