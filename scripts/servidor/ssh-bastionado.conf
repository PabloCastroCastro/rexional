# SSH de la Raspberry (docs/servidor.md, «Bastionado del sistema»). Se instala como
# /etc/ssh/sshd_config.d/10-bastionado.conf: sshd se queda con el primer valor que lee, así que
# tiene que ir antes que 50-cloud-init.conf, que permite entrar con contraseña.
# scripts/bastionado.sh ssh añade AllowUsers con el usuario que lo ejecuta.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
