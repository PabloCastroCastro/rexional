# Servidor (pruebas y producción): los servicios compilados.
# Cada entorno usa su propio nombre de proyecto, que separa contenedores y volúmenes:
#   docker compose -p vestuario-pruebas up -d --build
# Solo el proxy publica un puerto, en la red «externa». Las otras dos, «aplicacion» (proxy y backend)
# y «datos» (backend y db), son internas: Docker no las deja salir a ningún sitio, y el proxy no
# llega a la base de datos. Los contenedores
# no tienen capacidades, no pueden ganar privilegios y su sistema de archivos es de solo lectura:
# solo escriben en sus volúmenes y en tmpfs (GH-55).

name: vestuario

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-endurecido: &endurecido
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    <<: *endurecido
    # Directamente como postgres (sin pasar por root): sin capacidades no podría cambiar de usuario.
    # El volumen de datos ya es suyo
    user: postgres
    tmpfs:
      - /var/run/postgresql:uid=70,gid=70
      - /tmp:uid=70,gid=70
    networks: [datos]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vestuario}
      POSTGRES_USER: ${POSTGRES_USER:-vestuario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      # Desde PostgreSQL 18 el volumen se monta en /var/lib/postgresql (no en .../data)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging

  backend:
    build:
      context: ./backend
      target: runtime
    restart: unless-stopped
    <<: *endurecido
    tmpfs:
      - /tmp
    networks: [aplicacion, datos]
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-vestuario}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vestuario}
      # produccion salvo que el .env diga otra cosa; el seed solo se permite en desarrollo y pruebas
      ENTORNO: ${ENTORNO:-produccion}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET en .env}
      URL_PUBLICA: ${URL_PUBLICA:?Define URL_PUBLICA en .env}
      TZ: ${TZ:-Europe/Madrid}
      # Tamaño máximo de cada foto y vídeo de los ejercicios (MAX_SUBIDA del proxy debe cubrirlos)
      MAX_FOTO_MB: ${MAX_FOTO_MB:-15}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-150}
      # Tamaño máximo del escudo del club (GH-28)
      MAX_ESCUDO_MB: ${MAX_ESCUDO_MB:-2}
      # Límites de cada usuario y bloqueo de cuentas (GH-58; ver .env.example)
      LIMITE_PETICIONES_MINUTO: ${LIMITE_PETICIONES_MINUTO:-300}
      LIMITE_COSTOSAS_10MIN: ${LIMITE_COSTOSAS_10MIN:-30}
      LOGIN_FALLOS_BLOQUEO: ${LOGIN_FALLOS_BLOQUEO:-5}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  proxy:
    build:
      context: ./proxy
      additional_contexts:
        frontend: ./frontend
    restart: unless-stopped
    <<: *endurecido
    # conf.d lo genera la imagen al arrancar a partir de las plantillas; /tmp, el pid y los temporales.
    # Docker crea los tmpfs de root: se dan al usuario de nginx (101)
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /tmp:uid=101,gid=101
    networks: [externa, aplicacion]
    environment:
      BACKEND_URL: http://backend:3000
      MAX_SUBIDA: ${MAX_SUBIDA:-200m}
      # HSTS en HTTPS, en segundos (GH-57): 1 día al principio; 31536000 (1 año) cuando esté comprobado
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-86400}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      # En el servidor, PUERTO_INTERNO=8443: se publica el HTTPS (ver docker-compose.servidor.yml).
      # IP_PUBLICADA=127.0.0.1 lo deja solo para el propio servidor: producción, detrás de Tailscale
      # Funnel (GH-56). Sin ella, en todas las interfaces
      - "${IP_PUBLICADA:+${IP_PUBLICADA}:}${PUERTO:-8080}:${PUERTO_INTERNO:-8080}"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging

networks:
  # La del puerto publicado: solo el proxy
  externa:
  # Sin salida (ni a internet, ni al servidor, ni a otras redes): proxy y backend
  aplicacion:
    internal: true
  # Sin salida: backend y db
  datos:
    internal: true

volumes:
  db-data:
  uploads:
